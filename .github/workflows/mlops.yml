name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    # Bonus 1 (DagsHub): neu 3 secrets nay ton tai, MLflow se ghi len tracking
    # server tu xa. Neu khong, mlflow ghi cuc bo (mlruns/) va pipeline van chay binh thuong.
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # Ghi noi dung credentials ra file tam va set bien moi truong xac thuc (GCP).
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        # Chi pull train_phase1.csv va eval.csv (khong can train_phase2.csv).
        run: dvc pull data/train_phase1.csv data/eval.csv

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy do duoc: $ACC"

      - name: Rollback guard - so sanh voi model dang chay (Bonus 4)
        # Tai metrics.json cua model hien tai tren cloud (neu co) va so sanh.
        # Chi cho phep tiep tuc khi accuracy moi >= accuracy cu.
        run: |
          python - <<'EOF'
          import json, os
          from google.cloud import storage

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          new_acc = json.load(open("outputs/metrics.json"))["accuracy"]

          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/metrics.json")

          if not blob.exists():
              print(f"Chua co model truoc do tren cloud. Bo qua kiem tra rollback. "
                    f"Accuracy moi = {new_acc:.4f}")
              raise SystemExit(0)

          old_acc = json.loads(blob.download_as_text())["accuracy"]
          print(f"Accuracy cu = {old_acc:.4f} | Accuracy moi = {new_acc:.4f}")
          if new_acc < old_acc:
              raise SystemExit(
                  f"ROLLBACK: model moi ({new_acc:.4f}) kem hon model dang chay "
                  f"({old_acc:.4f}). Huy deploy."
              )
          print("PASSED rollback guard: model moi khong kem hon model cu.")
          EOF

      - name: Upload model to Cloud Storage
        # Upload models/model.pkl -> <bucket>/models/latest/model.pkl
        # Va upload metrics.json de lan chay sau co the so sanh (Bonus 4).
        run: |
          python - <<'EOF'
          from google.cloud import storage

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          bucket.blob("models/latest/model.pkl").upload_from_filename("models/model.pkl")
          bucket.blob("models/latest/metrics.json").upload_from_filename("outputs/metrics.json")
          print(f"Da upload model va metrics len gs://{bucket_name}/models/latest/")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

      - name: Save performance report as artifact (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Accuracy = {acc:.4f} (nguong = 0.70)")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print("PASSED: dat nguong chat luong, dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH. Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Chua san sang, thu lai ($i/5)..."
              sleep 3
            done
            echo "Health check that bai sau 5 lan thu."
            exit 1
