name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc OCI Object Storage (S3-compatible), pull du lieu bang DVC,
  # huan luyen mo hinh, upload artifact. Chi chay khi Job 1 hoan thanh.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    env:
      # Bonus 1 (DagsHub): neu co 3 secret nay, MLflow ghi len tracking server tu xa.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      # OCI Object Storage qua S3-compatible API (dung cho DVC va boto3).
      AWS_ACCESS_KEY_ID: ${{ secrets.OCI_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.OCI_REGION }}
      S3_ENDPOINT_URL: ${{ secrets.OCI_S3_ENDPOINT }}
      CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # DVC doc AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY tu env (job-level env o tren);
      # endpointurl cua OCI da nam trong .dvc/config (commit vao git, khong phai secret).
      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv data/eval.csv

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT
          echo "Accuracy do duoc: $ACC"

      - name: Rollback guard - so sanh voi model dang chay (Bonus 4)
        run: |
          python - <<'EOF'
          import json, os, boto3
          from botocore.client import Config
          from botocore.exceptions import ClientError

          bucket = os.environ["CLOUD_BUCKET"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              region_name=os.environ.get("AWS_DEFAULT_REGION"),
              config=Config(s3={"addressing_style": "path"}, signature_version="s3v4"),
          )
          new_acc = json.load(open("outputs/metrics.json"))["accuracy"]

          try:
              obj = s3.get_object(Bucket=bucket, Key="models/latest/metrics.json")
              old_acc = json.loads(obj["Body"].read())["accuracy"]
          except ClientError:
              print(f"Chua co model truoc do tren cloud. Bo qua kiem tra rollback. "
                    f"Accuracy moi = {new_acc:.4f}")
              raise SystemExit(0)

          print(f"Accuracy cu = {old_acc:.4f} | Accuracy moi = {new_acc:.4f}")
          if new_acc < old_acc:
              raise SystemExit(
                  f"ROLLBACK: model moi ({new_acc:.4f}) kem hon model dang chay "
                  f"({old_acc:.4f}). Huy deploy."
              )
          print("PASSED rollback guard: model moi khong kem hon model cu.")
          EOF

      - name: Upload model to OCI Object Storage
        run: |
          python - <<'EOF'
          import os, boto3
          from botocore.client import Config

          bucket = os.environ["CLOUD_BUCKET"]
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["S3_ENDPOINT_URL"],
              region_name=os.environ.get("AWS_DEFAULT_REGION"),
              config=Config(s3={"addressing_style": "path"}, signature_version="s3v4"),
          )
          s3.upload_file("models/model.pkl", bucket, "models/latest/model.pkl")
          s3.upload_file("outputs/metrics.json", bucket, "models/latest/metrics.json")
          print(f"Da upload model va metrics len s3://{bucket}/models/latest/ (OCI)")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

      - name: Save performance report as artifact (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          print(f"Accuracy = {acc:.4f} (nguong = 0.70)")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print("PASSED: dat nguong chat luong, dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len OCI Compute VM qua SSH. Chi chay khi Job 3 (Eval) thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Chua san sang, thu lai ($i/5)..."
              sleep 3
            done
            echo "Health check that bai sau 5 lan thu."
            exit 1
